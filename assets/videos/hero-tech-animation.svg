<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.45" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#8eeaff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)">
    <animate attributeName="x" values="0;-64" dur="8s" repeatCount="indefinite"/>
  </rect>

  <circle cx="310" cy="170" r="280" fill="url(#cyanGlow)" opacity="0.32">
    <animate attributeName="r" values="250;310;250" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1260" cy="245" r="330" fill="url(#cyanGlow)" opacity="0.2">
    <animate attributeName="r" values="300;370;300" dur="9s" repeatCount="indefinite"/>
  </circle>

  <g opacity="0.9" filter="url(#softGlow)">
    <path d="M465 315h660a42 42 0 0 1 42 42v286H423V357a42 42 0 0 1 42-42Z" fill="#06111f" stroke="#67e8f9" stroke-opacity="0.45" stroke-width="3"/>
    <path d="M545 245h500a30 30 0 0 1 30 30v87H515v-87a30 30 0 0 1 30-30Z" fill="#0f172a" stroke="#93c5fd" stroke-opacity="0.42" stroke-width="3"/>
    <path d="M520 430h560v140H520Z" fill="#020617" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="2"/>
    <path d="M575 660h450" stroke="#e0f2fe" stroke-opacity="0.42" stroke-width="8" stroke-linecap="round"/>
    <path d="M600 695h400" stroke="#22d3ee" stroke-opacity="0.28" stroke-width="5" stroke-linecap="round"/>
    <circle cx="1105" cy="388" r="16" fill="#22d3ee" opacity="0.8"/>
    <circle cx="1152" cy="388" r="12" fill="#60a5fa" opacity="0.7"/>
  </g>

  <g opacity="0.62">
    <path d="M230 275h215M1155 276h226M278 638h145M1180 650h180" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
    <path d="M327 275l42 42h88M1180 276l-45 48h-90M360 638l65-58h85M1240 650l-80-58h-90" stroke="#60a5fa" stroke-opacity="0.6" stroke-width="2" fill="none"/>
    <circle cx="230" cy="275" r="8" fill="#22d3ee"/>
    <circle cx="1381" cy="276" r="8" fill="#22d3ee"/>
    <circle cx="278" cy="638" r="8" fill="#60a5fa"/>
    <circle cx="1360" cy="650" r="8" fill="#60a5fa"/>
  </g>

  <rect x="500" y="430" width="600" height="22" fill="#67e8f9" opacity="0.0">
    <animate attributeName="y" values="430;548;430" dur="3.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.08;0.55;0.08" dur="3.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="0" width="1600" height="900" fill="#020617" opacity="0.18"/>

  <g opacity="0.5">
    <path d="M0 748C220 690 330 760 510 715s310-135 520-85 350 128 570 42v228H0Z" fill="#0ea5e9" opacity="0.1">
      <animate attributeName="d" dur="8s" repeatCount="indefinite" values="
        M0 748C220 690 330 760 510 715s310-135 520-85 350 128 570 42v228H0Z;
        M0 720C220 785 350 690 540 735s320 95 520 36 330-118 540-40v169H0Z;
        M0 748C220 690 330 760 510 715s310-135 520-85 350 128 570 42v228H0Z"/>
    </path>
  </g>
</svg>
